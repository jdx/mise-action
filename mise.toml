tasks.pre-commit = ["aubr all", "git add dist"]
tasks.test.alias = ["t"]
tasks.test.run = ["aubr all"]
tasks.lint = "aubr lint"
tasks."lint:fix" = "aubr format:write"
tasks.version = "aube version"
tasks.release-plz = "./scripts/release-plz.sh"

[tools]
node = '24'
aube = { version = 'latest', minimum_release_age = '0s' }
git-cliff = 'latest'
gh = 'latest'
communique = { version = 'latest', minimum_release_age = '0s' }
# hk.pkl amends a pinned hk package; the tools themselves float and are resolved by mise.lock.
hk = { version = 'latest', minimum_release_age = '0s' }
pkl = 'latest'
jactionlint = '2.1.0'
