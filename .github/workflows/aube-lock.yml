name: aube-lock

# Regenerates aube-lock.yaml on Renovate branches. Renovate's npm manager
# updates package.json but has no aube support, leaving the lockfile stale
# and breaking frozen installs in CI.

on:
  push:
    branches: ["renovate/**"]

# "-caller" keeps this group apart from the one the shared workflow sets for
# its own job (aube-lock-<ref>); equal groups would cancel the called job.
concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  aube-lock:
    permissions:
      contents: write
    uses: jdx/renovate-config/.github/workflows/aube-lock.yml@0a00c309f12e0bc78e18e220bc0ba95ed14552e8 # main (post-v1.0.2; adds client-id support)
    secrets:
      AUBE_LOCK_APP_CLIENT_ID: ${{ secrets.AUBE_LOCK_APP_CLIENT_ID }}
      AUBE_LOCK_APP_PRIVATE_KEY: ${{ secrets.AUBE_LOCK_APP_PRIVATE_KEY }}
